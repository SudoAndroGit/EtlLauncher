name: Build EternalLauncher (experimental)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'patches/**'
      - 'branding/**'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a private GitHub Release after the build succeeds'
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

# Discord Application ID (public identifier, not a bot token).
# Set repo variable ETERNAL_DISCORD_CLIENT_ID to show EternalLauncher on Discord.
env:
  ETERNAL_DISCORD_CLIENT_ID: ${{ vars.ETERNAL_DISCORD_CLIENT_ID }}

concurrency:
  group: eternallauncher-windows
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    outputs:
      upstream_tag: ${{ steps.upstream.outputs.tag }}
    timeout-minutes: 120
    steps:
      - name: Checkout EtlLauncher patch repository
        uses: actions/checkout@v4

      - name: Discover latest upstream application version
        id: upstream
        shell: pwsh
        run: |
          $refs = git ls-remote --tags --refs https://github.com/modrinth/code.git 'refs/tags/v*'
          $versions = @(
            foreach ($line in $refs) {
              if ($line -match '^([0-9a-f]{40})\s+refs/tags/(v(\d+)\.(\d+)\.(\d+))$') {
                [pscustomobject]@{
                  Sha = $Matches[1]
                  Tag = $Matches[2]
                  Major = [int]$Matches[3]
                  Minor = [int]$Matches[4]
                  Patch = [int]$Matches[5]
                  Version = [version]("$($Matches[3]).$($Matches[4]).$($Matches[5])")
                }
              }
            }
          )
          if ($versions.Count -eq 0) { throw 'No matching upstream vMAJOR.MINOR.PATCH tags found.' }
          $selected = $versions | Sort-Object Version -Descending | Select-Object -First 1
          "tag=$($selected.Tag)" >> $env:GITHUB_OUTPUT
          "sha=$($selected.Sha)" >> $env:GITHUB_OUTPUT
          Write-Host "Selected Modrinth $($selected.Tag) at $($selected.Sha)"

      - name: Avoid rebuilding unchanged upstream version
        id: cache
        uses: actions/cache@v4
        with:
          path: .build-marker/completed.txt
          key: eternallauncher-win-v3-${{ steps.upstream.outputs.sha }}-${{ hashFiles('patches/**', '.github/workflows/build.yml', 'branding/**') }}

      - name: Fetch official source
        if: github.event_name == 'workflow_dispatch' || steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
        run: git clone --depth 1 --branch "$env:UPSTREAM_TAG" https://github.com/modrinth/code.git upstream

      - name: Apply guarded customization
        if: github.event_name == 'workflow_dispatch' || steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: python patches/patch_launcher.py

      - name: Apply Sakura branding, logo and pink theme
        if: github.event_name == 'workflow_dispatch' || steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: python patches/brand_launcher.py

      - name: Remove Hosting, add Eternal welcome and configure Discord Rich Presence
        if: github.event_name == 'workflow_dispatch' || steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: python patches/eternal_features.py

      - name: Check Discord Rich Presence application ID
        if: github.event_name == 'workflow_dispatch' || steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          if ($env:ETERNAL_DISCORD_CLIENT_ID) {
            if ($env:ETERNAL_DISCORD_CLIENT_ID -notmatch '^[0-9]{17,20}
        if: github.event_name == 'workflow_dispatch' || steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: python patches/privacy_launcher.py

      - name: Setup Node.js
        if: github.event_name == 'workflow_dispatch' || steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: upstream/.nvmrc

      - name: Setup pnpm
        if: github.event_name == 'workflow_dispatch' || steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: upstream
        run: |
          corepack enable
          pnpm --version

      - name: Setup Rust
        if: github.event_name == 'workflow_dispatch' || steps.cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        if: github.event_name == 'workflow_dispatch' || steps.cache.outputs.cache-hit != 'true'
        working-directory: upstream
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Generate Sakura app icons (including Windows .ico)
        if: github.event_name == 'workflow_dispatch' || steps.cache.outputs.cache-hit != 'true'
        working-directory: upstream
        shell: pwsh
        run: |
          $iconPath = 'apps/app/icons/icon.ico'
          $originalHash = if (Test-Path $iconPath) { (Get-FileHash $iconPath -Algorithm SHA256).Hash } else { '' }
          pnpm --filter @modrinth/app tauri icon "$env:GITHUB_WORKSPACE/branding/logo.png" --output "$env:GITHUB_WORKSPACE/upstream/apps/app/icons"
          if ($LASTEXITCODE -ne 0) { throw 'Tauri icon generation failed' }
          foreach ($requiredIcon in @($iconPath, 'apps/app/icons/128x128.png', 'apps/app/icons/128x128@2x.png')) {
            if (!(Test-Path $requiredIcon)) { throw "Icon generation failed: $requiredIcon missing" }
            if ((Get-Item $requiredIcon).Length -lt 500) { throw "Generated icon is unexpectedly small: $requiredIcon" }
          }
          $generatedHash = (Get-FileHash $iconPath -Algorithm SHA256).Hash
          if ($generatedHash -eq $originalHash) { throw 'Generated Windows icon is still identical to upstream Modrinth icon' }
          Write-Host "Verified Sakura Windows icon generated: $generatedHash"

      - name: Configure official Modrinth build environment
        if: github.event_name == 'workflow_dispatch' || steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $source = 'upstream/packages/app-lib/.env.prod'
          $destination = 'upstream/packages/app-lib/.env'
          if (!(Test-Path $source)) { throw "Missing upstream production environment template: $source" }
          Copy-Item -LiteralPath $source -Destination $destination -Force
          $required = @(
            'MODRINTH_API_URL',
            'MODRINTH_API_URL_V3',
            'MODRINTH_API_BASE_URL',
            'SHARED_INSTANCES_API_BASE_URL',
            'MODRINTH_LAUNCHER_META_URL',
            'MODRINTH_SOCKET_URL',
            'MODRINTH_URL'
          )
          foreach ($key in $required) {
            if (!(Select-String -Path $destination -Pattern "^$key\s*=" -Quiet)) {
              throw "Production environment template does not define $key"
            }
          }
          Write-Host 'Official production environment file prepared; required keys found.'

      - name: Build Tauri NSIS installer
        if: github.event_name == 'workflow_dispatch' || steps.cache.outputs.cache-hit != 'true'
        working-directory: upstream
        shell: pwsh
        run: pnpm --filter @modrinth/app tauri build --bundles nsis

      - name: Upload private Windows installer
        if: github.event_name == 'workflow_dispatch' || steps.cache.outputs.cache-hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: EternalLauncher-${{ steps.upstream.outputs.tag }}-windows-x64
          path: upstream/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Mark successful build
        if: success() && (github.event_name == 'workflow_dispatch' || steps.cache.outputs.cache-hit != 'true')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .build-marker | Out-Null
          Set-Content .build-marker/completed.txt "${{ steps.upstream.outputs.tag }}"

  release:
    name: Publish private downloadable release
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installer built by this run
        uses: actions/download-artifact@v4
        with:
          name: EternalLauncher-${{ needs.build.outputs.upstream_tag }}-windows-x64
          path: release-assets

      - name: Validate installer and create SHA-256 checksum
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          shopt -s nullglob
          installers=( *.exe )
          if (( ${#installers[@]} != 1 )); then
            echo "Expected exactly one Windows installer, found ${#installers[@]}"
            exit 1
          fi
          sha256sum -- "${installers[0]}" > SHA256SUMS.txt
          echo "Prepared installer and checksum:"
          cat SHA256SUMS.txt

      - name: Publish private GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ needs.build.outputs.upstream_tag }}
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          release_tag="eternal-${UPSTREAM_TAG}-build.${BUILD_NUMBER}.${BUILD_ATTEMPT}"
          title="EternalLauncher Sakura Edition ${UPSTREAM_TAG} (build ${BUILD_NUMBER}.${BUILD_ATTEMPT})"
          cat > release-notes.md <<EOF
          EternalLauncher Sakura Edition — private experimental Windows x64 build.

          Upstream Modrinth App: ${UPSTREAM_TAG}
          EternalLauncher patch commit: ${GITHUB_SHA}

          Includes a Windows NSIS installer and SHA256SUMS.txt for verification.

          This is an unofficial, unsigned, customized build. Back up your Minecraft
          instances before installing. Windows SmartScreen may show a warning.
          EOF
          gh release create "${release_tag}" release-assets/*.exe release-assets/SHA256SUMS.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "${title}" \
            --notes-file release-notes.md \
            --prerelease
          echo "Published private release ${release_tag}"
) {
              throw 'ETERNAL_DISCORD_CLIENT_ID must be a 17-20 digit Discord Application ID.'
            }
            Write-Host 'Discord Rich Presence will use the configured EternalLauncher application.'
          } else {
            Write-Host 'No custom Discord application ID configured; Discord Rich Presence is disabled to avoid using the official Modrinth identity.'
          }

      - name: Disable optional telemetry and remote error reports
        if: github.event_name == 'workflow_dispatch' || steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: python patches/privacy_launcher.py

      - name: Setup Node.js
        if: github.event_name == 'workflow_dispatch' || steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: upstream/.nvmrc

      - name: Setup pnpm
        if: github.event_name == 'workflow_dispatch' || steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: upstream
        run: |
          corepack enable
          pnpm --version

      - name: Setup Rust
